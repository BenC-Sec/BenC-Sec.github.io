# Welcome to Jekyll!
#
# Site settings — used to personalise the site. Accessed in templates via
# {{ site.title }}, {{ site.email }}, and so on. This file is *NOT* reloaded
# automatically by `bundle exec jekyll serve`; restart the server after editing.

# --- Site identity ---
title: CTI in Practice
email: benc-sec@outlook.com
description: >- # ignore newlines until the next key
  Practical guidance to implement Cyber Threat Intelligence.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol, e.g. https://benc-sec.github.io
github_username: BenC-Sec
locale: "en-GB"
repository: "BenC-Sec/BenC-Sec.github.io"

# --- Theme: Minimal Mistakes (remote theme, GitHub Pages compatible) ---
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: "dark" # candidates: dark, dirt, plum, neon
words_per_minute: 200

# Liquid-based taxonomy archives (GitHub Pages safe — no jekyll-archives needed).
# Makes the stage/difficulty tags on each guide link through to /tags/.
tag_archive:
  type: liquid
  path: /tags/

# --- Plugins ---
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

# --- Author (powers the Minimal Mistakes sidebar / About) ---
author:
  name: "Ben Catten"
  avatar: # e.g. "/assets/images/bio-photo.jpg" (optional, add later)
  bio: "Cyber Threat Intelligence — practical guidance for newcomers."
  location: "United Kingdom"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bencatten/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:benc-sec@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/BenC-Sec"

# --- Site-wide footer links ---
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bencatten/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/BenC-Sec"

# --- Collections ---
collections:
  setup:
    output: true
    permalink: /:collection/:path/
  investigations:
    # Scaffolded but kept out of the nav until it has real content (D4/D5).
    output: true
    permalink: /:collection/:path/

# --- Front-matter defaults ---
defaults:
  # Blog posts = the "Guides" feed
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
      toc_sticky: true
      share: false
      comments: false
  # Setup collection
  - scope:
      path: ""
      type: setup
    values:
      layout: single
      author_profile: false
      toc: true
      toc_sticky: true
      share: false
  # Investigations collection (scaffolded)
  - scope:
      path: ""
      type: investigations
    values:
      layout: single
      author_profile: false
      toc: true
      share: false
  # Static pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

# Treat _pages as a source of pages
include:
  - _pages

# --- Reading files / exclude ---
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
